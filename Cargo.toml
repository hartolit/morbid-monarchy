[workspace]
members = [
    "adapters/gpu-world",
    "apps/morbid",
    "adapters/world-store",
    "crates/world-model",
    "crates/world-render",
    "crates/world-runtime",
    "tools/evidence",
]
resolver = "3"

[workspace.dependencies]
# The native client's overlay: egui and its winit and wgpu integrations, on the same wgpu
# (29) and winit (0.30) as the GPU owner.
egui = { version = "0.35.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.35.0", default-features = false }
egui-winit = { version = "0.35.0", default-features = false, features = ["clipboard", "wayland", "x11"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
# Standalone ECS for CPU orchestration (world-runtime); the engine's default features are off.
bevy_ecs = { version = "0.19.0", default-features = false, features = ["std"] }
bitcode = { version = "0.6.9", features = ["derive"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
# Offline WGSL validation; the same version wgpu 29.0.4 compiles shaders with.
naga = { version = "29.0.4", features = ["wgsl-in"] }
rand = "0.10.0"
redb = "4.0.0"
noise = "0.9.0"
# PNG frames the evidence runner writes from the native client's captures.
png = "0.18.1"
glam = "0.32.0"
futures-lite = "2.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
toml = "1.1.8"
wgpu = "29.0.4"

morbid-app = { path = "apps/morbid" }
world-model = { path = "crates/world-model" }
world-render = { path = "crates/world-render" }
world-runtime = { path = "crates/world-runtime" }
gpu-world = { path = "adapters/gpu-world" }
world-store = { path = "adapters/world-store" }

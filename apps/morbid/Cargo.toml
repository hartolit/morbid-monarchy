[package]
name = "morbid-app"
version = "0.1.0"
edition = "2024"
publish = false
description = "The native client: window, input and overlay over the GPU world, its renderer and the saved-world session."

[lib]
name = "morbid_app"
path = "src/lib.rs"

[[bin]]
name = "morbid"
path = "src/main.rs"

[dependencies]
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
futures-lite.workspace = true
gpu-world.workspace = true
serde.workspace = true
toml.workspace = true
wgpu.workspace = true
winit.workspace = true
world-model.workspace = true
world-render.workspace = true
world-runtime.workspace = true
world-store.workspace = true

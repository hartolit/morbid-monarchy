# Dependency policy for `cargo deny --locked check`, which `cargo evidence check static` runs with
# cargo-deny 0.20.2 (the version the lane and CI require).

[graph]
all-features = true

[advisories]
# A RustSec advisory against a locked crate fails the lane. Accept one only by listing its id
# here with the reason and the stage that removes it. Patch-level fixes are applied instead.
ignore = [
    # quick-xml < 0.41: quadratic attribute checks and unbounded namespace allocation. Only the
    # wayland-scanner proc-macro uses it (winit's and the clipboard's Wayland protocols), at
    # build time, on the protocol XML the wayland crates ship. 06 re-checked with winit 0.30.13:
    # wayland-scanner 0.31.10 still requires quick-xml 0.39; re-check when winit moves.
    { id = "RUSTSEC-2026-0194", reason = "build-time parsing of bundled Wayland protocol XML only; re-checked in 06" },
    { id = "RUSTSEC-2026-0195", reason = "build-time parsing of bundled Wayland protocol XML only; re-checked in 06" },
]

[licenses]
# The licenses the locked graph needs (re-derived in 06 after Bevy left); a new one is a
# decision, not a default.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause", # arrayref, zerocopy
    "BSD-3-Clause", # tiny-skia, moxcms, num_enum (window decorations and icons)
    "BSL-1.0",      # clipboard-win, error-code
    "CC0-1.0",      # hexf-parse (naga)
    "ISC",          # libloading
    "Unicode-3.0",  # unicode-ident
    "Zlib",         # bytemuck, foldhash, miniz_oxide and others
    "OFL-1.1",          # egui's bundled default fonts (epaint_default_fonts)
    "Ubuntu-font-1.0",  # the same fonts
]
confidence-threshold = 0.93

[licenses.private]
# The workspace packages are not published (`publish = false`) and declare no license.
ignore = true

[bans]
# The graph carries several major versions of some crates (wgpu's and winit's dependencies);
# `cargo tree --duplicates` lists them; they are not refused here.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

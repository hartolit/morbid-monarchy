[package]
name = "monarchy-evidence"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "monarchy-evidence"
description = "Development evidence runner: repository checks, CPU tests, adapter inspection, GPU suites and baseline measurement."

[features]
default = []
# Builds the `legacy-baseline` scenario driver, which links the Bevy baseline application.
# The runner builds it on demand for `bench`; ordinary checks do not compile Bevy for it.
legacy-baseline = ["dep:bevy", "dep:monarch-engine", "dep:bevy-baseline", "dep:spatial-lib"]

[dependencies]
futures-lite.workspace = true
gpu-world.workspace = true
# The native client, driven by scripts for its interactive evidence (`native-client`).
morbid-app.workspace = true
png.workspace = true
# Damages stored rows in place for the streaming suite's refusal cases.
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
wgpu.workspace = true
world-model.workspace = true
world-render.workspace = true
world-runtime.workspace = true
world-store.workspace = true

bevy = { workspace = true, optional = true }
monarch-engine = { workspace = true, optional = true }
bevy-baseline = { workspace = true, optional = true }
spatial-lib = { workspace = true, optional = true }

[[bin]]
name = "legacy-baseline"
required-features = ["legacy-baseline"]

[[bin]]
name = "native-client"

[[bin]]
name = "gpu-suite"

[package]
name = "monarchy-evidence"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "monarchy-evidence"
description = "Development evidence runner: repository checks, CPU tests, adapter inspection, GPU suites, scripted native-client runs and frame measurement."

[dependencies]
futures-lite.workspace = true
gpu-world.workspace = true
# The native client, driven by scripts for its interactive evidence and measurement
# (`native-client`).
morbid-app.workspace = true
png.workspace = true
# Damages stored rows in place for the streaming suite's refusal cases.
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
wgpu.workspace = true
world-model.workspace = true
world-render.workspace = true
world-runtime.workspace = true
world-store.workspace = true

[[bin]]
name = "native-client"

[[bin]]
name = "gpu-suite"

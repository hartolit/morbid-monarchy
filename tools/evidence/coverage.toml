# Behavioral coverage registry, checked by `cargo evidence test cpu`.
#
# Every test in a covered package must appear here, and every entry must run and pass. `id` is
# the stable coverage identity: when a test is renamed or moves to another owner, update
# `package`, `target` and `test` and keep `id`. `origin = "baseline"` marks the 28 tests that
# existed before the GPU transition; the runner requires all 28 to stay registered.
#
# determinism: "exact" (integer or otherwise reproducible), "float-tolerance" (floating body
# motion against physical bounds), "stochastic-thread-rng" (probabilistic: the rule draws from a
# thread-seeded RNG, so a single run is not an exact oracle).

# --- Column rules: monarch-engine core/world/cell.rs ---

[[behavior]]
id = "cell.inflow.small-absorbed"
package = "monarch-engine"
target = "lib"
test = "core::world::cell::tests::small_inflow_is_absorbed_by_a_deeper_pool"
origin = "baseline"
expectation = "A smaller inflow of another liquid joins a deeper pool: the resident material stays and the combined volume is kept."
destination = "world-model column rules (01); per-cell GPU rule (03)"
determinism = "exact"

[[behavior]]
id = "cell.inflow.larger-takes-over"
package = "monarch-engine"
target = "lib"
test = "core::world::cell::tests::larger_inflow_takes_the_column_over_without_losing_volume"
origin = "baseline"
expectation = "A larger inflow takes the column's material over and keeps the combined volume."
destination = "world-model column rules (01); per-cell GPU rule (03)"
determinism = "exact"

[[behavior]]
id = "cell.quench.either-order"
package = "monarch-engine"
target = "lib"
test = "core::world::cell::tests::magma_and_coolant_quench_into_rock_either_way_round"
origin = "baseline"
expectation = "Magma received by a coolant pool raises stone by the magma volume; coolant received by magma quenches the magma to stone, then fills the column."
destination = "world-model column rules (01); per-cell GPU rule with the corrected ceiling accounting (03)"
determinism = "exact"

[[behavior]]
id = "cell.phase.ice-solid-volume-kept"
package = "monarch-engine"
target = "lib"
test = "core::world::cell::tests::ice_is_solid_and_phase_changes_keep_volume"
origin = "baseline"
expectation = "Freezing makes the water a solid that adds to the solid top and accepts no liquid; thawing restores the same water volume."
destination = "world-model column rules (01); per-cell GPU rule (03)"
determinism = "exact"

[[behavior]]
id = "cell.drain.clears-state"
package = "monarch-engine"
target = "lib"
test = "core::world::cell::tests::draining_dry_clears_the_liquid_state"
origin = "baseline"
expectation = "Draining a column dry returns only the volume present and clears its liquid material and momentum flags."
destination = "world-model column rules (01); per-cell GPU rule (03)"
determinism = "exact"


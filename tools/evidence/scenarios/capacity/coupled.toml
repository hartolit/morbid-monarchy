# Frozen capacity scenario, prompt 01. Do not edit to make a run faster: a changed workload
# is a new scenario with its own name. Physical actions are scheduled by simulation tick.
# Site: seed 69, the shore of the lake north-west of the origin chunk. The lake (water level 100)
# spans x -192..120, y 296..424; a sand band (elevation 100-119, 5 loose sand) runs through
# x 0..288, y 288..330; grass lies to the south. Cell coordinates are (x, y); y is render -z.

schema = 1
profile = "capacity"
case = "coupled"
description = "Metal and wood spheres on the sand bank, one driven toward the lake with periodic jumps, all pulled between the shallows and the bank, while water and sand are poured and the observer slowly circles the shore."

[world]
seed = 69
active_radius_chunks = [32, 32]
tick_rate_hz = 60.0
max_ticks_per_frame = 4
ambient_temperature_c = 12.0
elevation_scale = 0.5
families = ["liquid", "granular", "thermal", "fire", "biology"]

[presentation]
resolution = [1920, 1080]
present_mode = "no-vsync"
overlay = true

[camera]
start_cell = [200, 230]
height = 150.0
yaw_degrees = 30.0
pitch_degrees = -40.0
path = [[200, 230], [328, 230], [328, 358], [200, 358]]
cells_per_tick = 0.25

[run]
runs = 3
warmup_frames = 120
measured_frames = 600
residency_timeout_seconds = 1800.0

[[bodies]]
preset = "metal"
count = 3072
origin_cell = [-200, 100]
columns = 64
spacing_cells = 12.0
drop_height = 10.0
at_tick = 0

[[bodies]]
preset = "wood"
count = 1024
origin_cell = [600, 100]
columns = 32
spacing_cells = 12.0
drop_height = 10.0
at_tick = 0

[[actions]]
kind = "drive"
direction = [-1.0, 1.0]
from_tick = 60
to_tick = 1000000
jump_every_ticks = 300

[[actions]]
kind = "attract"
cell = [110, 340]
alternate_cell = [180, 300]
alternate_every_ticks = 300
from_tick = 240
to_tick = 1000000

[[actions]]
kind = "brush"
tool = "water"
cell = [250, 310]
radius = 4
strength = 6
from_tick = 0
to_tick = 1000000
every_ticks = 1

[[actions]]
kind = "brush"
tool = "sand"
cell = [190, 270]
radius = 3
strength = 1
from_tick = 0
to_tick = 1000000
every_ticks = 10

# Frozen capacity scenario, prompt 01. Do not edit to make a run faster: a changed workload
# is a new scenario with its own name. Physical actions are scheduled by simulation tick.
# Site: seed 69, the shore of the lake north-west of the origin chunk. The lake (water level 100)
# spans x -192..120, y 296..424; a sand band (elevation 100-119, 5 loose sand) runs through
# x 0..288, y 288..330; grass lies to the south. Cell coordinates are (x, y); y is render -z.

schema = 1
profile = "capacity"
case = "streaming"
description = "The observer flies 64 chunks east and back at 3 cells per tick (near sprint speed), so chunks load and generate, overflow the 1,152-chunk cache, are evicted and saved, and are read back from the store on return."

[world]
seed = 69
active_radius_chunks = [32, 32]
tick_rate_hz = 60.0
max_ticks_per_frame = 4
ambient_temperature_c = 12.0
elevation_scale = 0.5
families = ["liquid", "granular", "thermal", "fire", "biology"]

[presentation]
resolution = [1920, 1080]
present_mode = "no-vsync"
overlay = true

[camera]
start_cell = [200, 230]
height = 150.0
yaw_degrees = 30.0
pitch_degrees = -40.0
path = [[200, 230], [4296, 230]]
cells_per_tick = 3.0

[run]
runs = 3
warmup_ticks = 120
measured_ticks = 600
residency_timeout_seconds = 1800.0

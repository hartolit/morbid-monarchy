# Frozen scale scenario, prompt 01. Do not edit to make a run faster: a changed workload
# is a new scenario with its own name. Physical actions are scheduled by simulation tick.
# Site: seed 69, the shore of the lake north-west of the origin chunk. The lake (water level 100)
# spans x -192..120, y 296..424; a sand band (elevation 100-119, 5 loose sand) runs through
# x 0..288, y 288..330; grass lies to the south. Cell coordinates are (x, y); y is render -z.

schema = 1
profile = "scale"
case = "flow"
description = "Water poured continuously onto the sand bank flows into the lake while lava pours into the shallows and quenches."

[world]
seed = 69
active_radius_chunks = [16, 16]
tick_rate_hz = 60.0
max_ticks_per_frame = 4
ambient_temperature_c = 12.0
elevation_scale = 0.5
families = ["liquid", "granular", "thermal", "fire", "biology"]

[presentation]
resolution = [1920, 1080]
present_mode = "no-vsync"
overlay = true

[camera]
start_cell = [200, 230]
height = 150.0
yaw_degrees = 30.0
pitch_degrees = -40.0

[run]
runs = 5
warmup_ticks = 300
measured_ticks = 1800
residency_timeout_seconds = 600.0

[[actions]]
kind = "brush"
tool = "water"
cell = [230, 300]
radius = 6
strength = 8
from_tick = 0
to_tick = 1000000
every_ticks = 1

[[actions]]
kind = "brush"
tool = "lava"
cell = [110, 335]
radius = 3
strength = 4
from_tick = 0
to_tick = 1000000
every_ticks = 2
